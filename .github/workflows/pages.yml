name: Deploy anniversary site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      media_tag:
        description: Published release tag containing 1.mp4
        default: anniversary-media
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site/video
          cp -R index.html pages css js photo music models _site/

      - name: Add video from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MEDIA_TAG: ${{ inputs.media_tag }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '1.mp4' --dir _site/video -- "$MEDIA_TAG"
          test -s _site/video/1.mp4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
